# Portable defaults. Keep host-specific paths/devices/DB services in .env or docker-compose.override.yml.
x-bookoasis-image: &bookoasis-image
  image: bookoasis:local
  build:
    context: .
    dockerfile: Dockerfile

x-bookoasis-volumes: &bookoasis-volumes
  - type: bind
    source: ./db
    target: /app/db
    bind:
      create_host_path: false
  - type: bind
    source: ./covers
    target: /app/covers
    bind:
      create_host_path: false
  - type: bind
    source: ./cache
    target: /app/cache
    bind:
      create_host_path: false
  - type: bind
    source: ./plugins
    target: /app/plugins
    bind:
      create_host_path: false
  - type: bind
    source: ${RCLONE_CONFIG_DIR:-./rclone}
    target: /app/rclone
    bind:
      create_host_path: false
  - type: bind
    source: ./logs
    target: /app/logs
    bind:
      create_host_path: false
  - type: bind
    source: ./custom_fonts
    target: /app/static/fonts/custom
    bind:
      create_host_path: false
  - type: bind
    source: ${BOOKS_DIR:-./books}
    target: /book
    bind:
      create_host_path: false
      propagation: rslave
  - type: bind
    source: ${COMICS_DIR:-./comics}
    target: /data/comics
    read_only: true
    bind:
      create_host_path: false
      propagation: rslave

services:
  bookoasis-volume-check:
    <<: *bookoasis-image
    container_name: bookoasis_volume_check
    restart: unless-stopped
    volumes: *bookoasis-volumes
    entrypoint: ["sh", "-c", "while :; do sleep 3600; done"]
    healthcheck:
      test:
        ["CMD", "python3", "/app/tools/check_volume_paths.py", "/app/db", "/app/covers", "/app/cache", "/app/plugins", "/app/rclone", "/app/logs", "/app/static/fonts/custom", "/book", "/data/comics"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 0s

  bookoasis:
    <<: *bookoasis-image
    container_name: bookoasis
    restart: unless-stopped
    stop_grace_period: 1m
    ports:
      - "${BOOKOASIS_PORT:-5930}:5930"
    volumes: *bookoasis-volumes
    env_file:
      - .env
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      PORT: "5930"
      TZ: ${TZ:-Asia/Seoul}
      REDIS_URL: redis://redis:6379/0
      LOG_ARCHIVE_MAX_FILES: "10"
      LOG_ARCHIVE_MAX_MB: "200"
      DB_ENGINE: ${DB_ENGINE:-sqlite}
    depends_on:
      bookoasis-volume-check:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        ["CMD", "python3", "/app/tools/check_volume_paths.py", "/app/db", "/app/covers", "/app/cache", "/app/plugins", "/app/rclone", "/app/logs", "/app/static/fonts/custom", "/book", "/data/comics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m

  redis:
    image: redis:7-alpine
    container_name: bookoasis_redis
    restart: unless-stopped
