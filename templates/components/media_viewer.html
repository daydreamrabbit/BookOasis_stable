<!-- 내장 미디어 통합 뷰어 모달 (뷰어는 전체화면이 필요하므로 유지) -->
<div id="media-viewer-modal" class="viewer-modal">
    <!-- 전체화면 탈출용 플로팅 닫기 버튼 -->
    <button class="floating-close-btn" data-role="viewer-action" data-action="close" data-i18n-title="viewer.close_fullscreen" title="전체화면 닫기 (ESC)" style="display: none;">
        <i class="fa-solid fa-xmark"></i>
    </button>

    <div class="viewer-header ridi-viewer-toolbar ridi-viewer-toolbar-top">
        <button class="ridi-viewer-back" type="button" data-role="viewer-action" data-action="close" aria-label="뷰어 닫기" title="뒤로가기">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <span class="viewer-title" id="viewer-title-text" data-i18n="viewer.reading">독서 중...</span>
        <div class="ridi-viewer-mode-group" role="group" aria-label="보기 방식">
            <button type="button" data-role="viewer-action" data-action="viewer-display-mode" data-value="one" data-viewer-display-mode="one" aria-label="한쪽 보기" title="한쪽 보기"><span class="viewer-mode-icon viewer-mode-icon--one"><i>1</i></span></button>
            <button type="button" data-role="viewer-action" data-action="viewer-display-mode" data-value="one-two" data-viewer-display-mode="one-two" aria-label="왼쪽에서 오른쪽 두 쪽 보기" title="1→2 두 쪽 보기"><span class="viewer-mode-icon viewer-mode-icon--spread"><i>1</i><i>2</i></span></button>
            <button type="button" data-role="viewer-action" data-action="viewer-display-mode" data-value="two-one" data-viewer-display-mode="two-one" aria-label="오른쪽에서 왼쪽 두 쪽 보기" title="2←1 두 쪽 보기"><span class="viewer-mode-icon viewer-mode-icon--spread"><i>2</i><i>1</i></span></button>
            <button type="button" data-role="viewer-action" data-action="viewer-display-mode" data-value="scroll" data-viewer-display-mode="scroll" aria-label="세로 스크롤 보기" title="세로 스크롤 보기"><span class="viewer-mode-icon viewer-mode-icon--scroll"><i>↕</i></span></button>
        </div>
        <nav class="ridi-viewer-tools" aria-label="독서 도구">
            <button type="button" id="btn-viewer-listen" data-role="viewer-action" data-action="listen" data-i18n-title="tts.viewer_listen_title" title="읽던 위치부터 음성으로 듣기" style="display: none;"><i class="fa-solid fa-headphones"></i><span data-i18n="tts.viewer_listen">듣기</span></button>
            <button type="button" id="btn-viewer-tts-settings" data-role="viewer-action" data-action="tts-settings" title="TTS 설정" aria-label="TTS 설정" style="display: none;"><i class="fa-solid fa-sliders"></i><span>TTS 설정</span></button>
            <button type="button" data-role="viewer-action" data-action="open-toc"><i class="fa-solid fa-list"></i><span>목차</span></button>
            <button type="button" data-role="viewer-action" data-action="open-reading-notes"><i class="fa-regular fa-note-sticky"></i><span>독서노트</span></button>
            <button type="button" data-role="viewer-action" data-action="toggle-overlay"><i class="fa-solid fa-font"></i><span>보기 설정</span></button>
            <button type="button" data-role="viewer-action" data-action="open-viewer-search"><i class="fa-solid fa-magnifying-glass"></i><span>검색</span></button>
            <button type="button" id="btn-add-bookmark" data-role="viewer-action" data-action="toggle-page-bookmark" aria-pressed="false"><i class="fa-regular fa-bookmark"></i><span>책갈피</span></button>
        </nav>
        <div class="viewer-controls">
            <div id="txt-controls" class="txt-controls-panel" style="display:none;"></div>
            <div id="comic-fit-controls" class="comic-fit-panel" style="display:none;"></div>
            <button id="btn-fullscreen-toggle" class="btn-fullscreen" data-role="viewer-action" data-action="toggle-fullscreen" data-i18n-title="viewer.fullscreen" title="전체화면 (F)"><i class="fa-solid fa-expand" id="fullscreen-icon"></i></button>
        </div>

    </div>
    
    <div class="viewer-body" id="viewer-body-container" style="position: relative;">
        <!-- 공통 3분할 투명 핫스팟 터치 레이어 (뷰어 최상단 배치) -->
        <div class="comic-hotspot-layer" id="common-viewer-hotspot" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10002; display: flex; pointer-events: auto;">
            <div class="hotspot-zone left-zone" data-role="viewer-action" data-action="prev-page" data-i18n-title="viewer.prev_page" title="이전 페이지"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="hotspot-zone center-zone" data-role="viewer-action" data-action="toggle-viewer-controls" title="도구 모음 표시/숨기기"></div>
            <div class="hotspot-zone right-zone" data-role="viewer-action" data-action="next-page" data-i18n-title="viewer.next_page" title="다음 페이지"><i class="fa-solid fa-chevron-right"></i></div>
        </div>

        <!-- Kavita 스타일 플로팅 조작 오버레이 메뉴 (탭 형식 개편 & 푸른색 테마) -->
        <div id="comic-overlay-menu" class="comic-overlay-menu" style="display: none; z-index: 10003;">
            <section class="ridi-view-settings" aria-label="보기 설정">
                <header><strong>보기 설정</strong><button type="button" data-role="viewer-action" data-action="toggle-overlay" aria-label="닫기"><i class="fa-solid fa-xmark"></i></button></header>
                <div class="ridi-theme-options" role="group" aria-label="배경색">
                    <strong class="ridi-setting-group-label">배경색</strong>
                    <button type="button" data-role="viewer-action" data-action="viewer-theme" data-value="epaper" title="E-Paper"></button>
                    <button type="button" data-role="viewer-action" data-action="viewer-theme" data-value="white" title="화이트"></button>
                    <button type="button" data-role="viewer-action" data-action="viewer-theme" data-value="sepia" title="세피아"></button>
                    <button type="button" data-role="viewer-action" data-action="viewer-theme" data-value="light" title="라이트"></button>
                    <button type="button" data-role="viewer-action" data-action="viewer-theme" data-value="mint" title="민트"></button>
                    <button type="button" data-role="viewer-action" data-action="viewer-theme" data-value="gray" title="그레이"></button>
                    <button type="button" data-role="viewer-action" data-action="viewer-theme" data-value="blue" title="블루"></button>
                    <button type="button" data-role="viewer-action" data-action="viewer-theme" data-value="navy" title="네이비"></button>
                    <button type="button" data-role="viewer-action" data-action="viewer-theme" data-value="dark" title="다크"></button>
                    <button type="button" data-role="viewer-action" data-action="viewer-theme" data-value="black" title="블랙"></button>
                </div>
                <label class="ridi-setting-row ridi-font-row ridi-text-setting"><span><i class="fa-solid fa-font"></i> 글꼴</span><select id="ridi-viewer-font-select" data-role="viewer-action-change" data-action="font-family" aria-label="뷰어 글꼴"><option value="pretendard">Pretendard</option><option value="gothic">나눔고딕</option><option value="batang">바탕체</option><option value="monospace">고정폭</option></select></label>
                <div class="ridi-setting-row ridi-text-setting"><span><i class="fa-solid fa-text-width"></i> 글자 크기</span><div class="ridi-step-control"><button type="button" data-role="viewer-action" data-action="font-size" data-value="-1">−</button><output id="ridi-font-size-value">18px</output><button type="button" data-role="viewer-action" data-action="font-size" data-value="1">＋</button></div></div>
                <div class="ridi-setting-row ridi-text-setting"><span><i class="fa-solid fa-text-height"></i> 줄 간격</span><div class="ridi-step-control"><button type="button" data-role="viewer-action" data-action="line-height-step" data-value="-1">−</button><output id="ridi-line-height-value">1.8</output><button type="button" data-role="viewer-action" data-action="line-height-step" data-value="1">＋</button></div></div>
                <div class="ridi-setting-row ridi-text-setting"><span><i class="fa-solid fa-align-justify"></i> 문단 간격</span><div class="ridi-step-control"><button type="button" data-role="viewer-action" data-action="paragraph-spacing-step" data-value="-1">−</button><output id="ridi-paragraph-spacing-value">1.0em</output><button type="button" data-role="viewer-action" data-action="paragraph-spacing-step" data-value="1">＋</button></div></div>
                <div class="ridi-image-settings" id="ridi-image-settings" hidden>
                    <div class="ridi-image-setting-row">
                        <span><i class="fa-regular fa-image"></i> 이미지 크기</span>
                        <div class="ridi-choice-grid ridi-fit-choices">
                            <button type="button" data-role="viewer-action" data-action="comic-fit" data-value="width" data-comic-fit-mode="width">폭맞춤</button>
                            <button type="button" data-role="viewer-action" data-action="comic-fit" data-value="height" data-comic-fit-mode="height">높이맞춤</button>
                        </div>
                    </div>
                </div>
                <div class="ridi-image-setting-row ridi-page-direction-settings" id="ridi-page-direction-settings" hidden>
                    <span><i class="fa-solid fa-hand-pointer"></i> 페이지 이동</span>
                    <div class="ridi-choice-grid ridi-direction-choices">
                        <button type="button" data-role="viewer-action" data-action="tap-zone-direction" data-value="horizontal" data-tap-zone-direction="horizontal">좌→우</button>
                        <button type="button" data-role="viewer-action" data-action="tap-zone-direction" data-value="horizontal-reverse" data-tap-zone-direction="horizontal-reverse">우→좌</button>
                        <button type="button" data-role="viewer-action" data-action="tap-zone-direction" data-value="vertical" data-tap-zone-direction="vertical">상→하</button>
                        <button type="button" data-role="viewer-action" data-action="tap-zone-direction" data-value="vertical-reverse" data-tap-zone-direction="vertical-reverse">하→상</button>
                    </div>
                </div>
                <div class="ridi-spread-settings" id="ridi-spread-settings" hidden>
                    <button type="button" id="ridi-center-gap-button" data-role="viewer-action" data-action="toggle-center-gap"><i class="fa-solid fa-grip-lines-vertical"></i><span>가운데 여백 제거</span></button>
                    <button type="button" id="ridi-spread-shift-button" data-role="viewer-action" data-action="shift-spread"><i class="fa-solid fa-forward-step"></i><span>한 장 밀기</span></button>
                </div>
            </section>
            <div class="overlay-header">
                <!-- 탭 네비게이션: 항상 상단에 노출되는 메뉴 버튼들 (예전엔 화면 중앙 카드 안에 있었음) -->
                <div class="overlay-tab-nav">
                    <button class="overlay-tab-btn active" id="tab-btn-nav" data-role="viewer-action" data-action="overlay-tab" data-value="nav">
                        <i class="fa-solid fa-compass"></i> <span data-i18n="viewer.tab_nav">이동</span>
                    </button>
                    <button class="overlay-tab-btn" id="tab-btn-layout" data-role="viewer-action" data-action="overlay-tab" data-value="layout">
                        <i class="fa-solid fa-book-open"></i> <span data-i18n="viewer.tab_layout">보기</span>
                    </button>
                    <button class="overlay-tab-btn" id="tab-btn-style" data-role="viewer-action" data-action="overlay-tab" data-value="style">
                        <i class="fa-solid fa-font"></i> <span>글꼴</span>
                    </button>
                    <button class="overlay-tab-btn" id="tab-btn-margin" data-role="viewer-action" data-action="overlay-tab" data-value="margin">
                        <i class="fa-solid fa-arrows-up-down-left-right"></i> <span data-i18n="viewer.tab_margin">여백</span>
                    </button>
                </div>
                <button class="overlay-close-btn" data-role="viewer-action" data-action="close" data-i18n-title="viewer.close_fullscreen" title="뷰어 닫기">&times;</button>
            </div>

            <div class="overlay-controls-panel">
                <!-- 탭 1: 탐색 / 이동 -->
                <div class="overlay-tab-content active" id="overlay-tab-nav">
                    <div class="overlay-controls-row">
                        <button class="btn-overlay-action" data-role="viewer-action" data-action="jump-first"><i class="fa-solid fa-backward-step"></i> <span data-i18n="viewer.from_beginning">처음부터</span></button>
                        <button class="btn-overlay-action" data-role="viewer-action" data-action="mark-completed"><i class="fa-solid fa-circle-check"></i> <span data-i18n="viewer.mark_completed">읽음 완료</span></button>
                        <button class="btn-overlay-action" data-role="viewer-action" data-action="jump-last"><i class="fa-solid fa-forward-step"></i> <span data-i18n="viewer.to_last_page">마지막으로</span></button>
                        <button class="btn-overlay-action" id="annotation-mode-toggle" data-role="viewer-action" data-action="toggle-highlight-mode" title="본문을 드래그해 형광펜 표시">
                            <i class="fa-solid fa-highlighter"></i> <span>형광펜</span>
                        </button>
                    </div>
                </div>

                <!-- 탭 2: 레이아웃 / 보기 방식 -->
                <div class="overlay-tab-content" id="overlay-tab-layout">
                    <div class="overlay-controls-row">
                        <span class="viewer-control-label">읽기 방식</span>
                        <!-- 하위 호환용 상태 컨트롤: 실제 모드 선택은 상단 4분할 버튼에서 한다. -->
                        <div class="overlay-scroll-group viewer-legacy-mode-controls" id="overlay-scroll-mode-group" hidden>
                            <button id="btn-scroll-page" class="btn-overlay-fit active" data-role="viewer-action" data-action="scroll-mode" data-value="page" data-i18n-title="viewer.scroll_page" title="책장처럼 넘기기">
                                <i class="fa-solid fa-book-open"></i> <span data-i18n="viewer.page">페이지</span>
                            </button>
                            <button id="btn-scroll-continuous" class="btn-overlay-fit" data-role="viewer-action" data-action="scroll-mode" data-value="scroll" data-i18n-title="viewer.scroll_continuous" title="아래로 스크롤">
                                <i class="fa-solid fa-arrows-up-down"></i> <span data-i18n="viewer.scroll">스크롤</span>
                            </button>
                        </div>

                        <!-- 1장/2장 보기 -->
                        <button id="btn-comic-page-step" class="btn-overlay-fit viewer-legacy-mode-controls" data-role="viewer-action" data-action="toggle-page-step" title="1장/2장 보기 전환" hidden>
                            <i class="fa-solid fa-file-lines"></i> <span id="comic-page-step-label">1장</span>
                        </button>

                        <button id="btn-spread-shift" class="btn-overlay-fit viewer-legacy-mode-controls" data-role="viewer-action" data-action="shift-spread" title="첫 표지는 단독으로, 다음 페이지부터 두 장씩 보기" style="display: none;" hidden>
                            <i class="fa-solid fa-book-open-reader"></i> <span>표지 단독</span>
                        </button>

                        <!-- 다음 버튼부터 줄바꿈 (컨트롤이 많아 한 줄에 다 안 들어감) -->
                        <div class="overlay-row-break"></div>

                        <!-- 2장 보기 중앙 여백 토글 -->
                        <button id="btn-comic-center-gap" class="btn-overlay-fit" data-role="viewer-action" data-action="toggle-center-gap" title="2장 보기 중앙 여백 토글">
                            <i class="fa-solid fa-grip-lines-vertical"></i> <span id="comic-center-gap-label" data-i18n="viewer.center_gap_show">중앙 여백</span>
                        </button>

                        <!-- 읽기 방향 -->
                        <button id="btn-comic-reading-direction" class="btn-overlay-fit" data-role="viewer-action" data-action="toggle-reading-direction" title="읽기 방향 전환">
                            <i class="fa-solid fa-right-left"></i> <span id="comic-reading-direction-label">왼쪽→오른쪽</span>
                        </button>

                        <!-- 탭존 방향 (좌/우 ↔ 상/하, 한손 파지 대응) -->
                        <button id="btn-tap-zone-direction" class="btn-overlay-fit" data-role="viewer-action" data-action="toggle-tap-zone-direction" data-i18n-title="viewer.tap_zone_direction" title="탭존 방향 전환 (좌/우 ↔ 상/하)">
                            <i class="fa-solid fa-arrows-left-right"></i> <span id="tap-zone-direction-label" data-i18n="viewer.tap_zone_horizontal">좌/우</span>
                        </button>

                        <!-- 모바일 전용 전체화면 전환 버튼 (안드로이드, iOS) -->
                        <button id="btn-overlay-fullscreen-mobile" class="btn-overlay-fit" data-role="viewer-action" data-action="toggle-fullscreen" style="display: none;" title="전체화면 전환">
                            <i class="fa-solid fa-expand" id="overlay-mobile-fullscreen-icon"></i> <span id="overlay-mobile-fullscreen-label" data-i18n="viewer.fullscreen">전체화면</span>
                        </button>
                    </div>

                    <!-- 이미지/PDF 너비 조절 슬라이더 (스크롤 모드일 때만 표시) -->
                    <div class="overlay-width-row" id="overlay-width-row">
                        <span class="overlay-width-label" data-i18n="viewer.image_width">크기 (너비):</span>
                        <input
                            type="range"
                            id="comic-scroll-width-slider"
                            class="comic-scroll-width-slider"
                            min="400"
                            max="1400"
                            step="50"
                            value="800"
                            data-role="viewer-action-input" data-action="comic-scroll-width"
                        >
                        <span class="overlay-width-value" id="comic-scroll-width-label">800px</span>
                    </div>
                </div>

                <!-- 탭 3: 텍스트 및 EPUB 뷰어 스타일 옵션 -->
                <div class="overlay-tab-content" id="overlay-tab-style">
                    <div class="overlay-controls-row" id="overlay-txt-controls-row">
                        <div class="overlay-txt-group" id="overlay-txt-controls-group">
                            <label class="viewer-field"><span>글꼴</span>
                            <select id="viewer-font-select" data-role="viewer-action-change" data-action="font-family" class="overlay-select">
                                <option value="gothic">나눔고딕</option>
                                <option value="pretendard">Pretendard</option>
                            </select>
                            </label>
                            <label class="viewer-field"><span>배경</span>
                            <select id="viewer-theme-select" data-role="viewer-action-change" data-action="theme" class="overlay-select" title="배경색 선택">
                                <option value="epaper">E-Paper (순백/순검정)</option>
                                <option value="white">화이트 (순백)</option>
                                <option value="sepia">세피아 (미색)</option>
                                <option value="light">라이트 (회색)</option>
                                <option value="dark">다크 (기본)</option>
                                <option value="black">블랙 (OLED)</option>
                            </select>
                            </label>
                            <label class="viewer-field"><span>행간</span>
                            <select id="viewer-line-height-select" data-role="viewer-action-change" data-action="line-height" class="overlay-select" title="행간 조절">
                                <option value="1.2">행간 1.2</option>
                                <option value="1.4">행간 1.4</option>
                                <option value="1.6">행간 1.6</option>
                                <option value="1.8">행간 1.8 (기본)</option>
                                <option value="2.0">행간 2.0</option>
                                <option value="2.2">행간 2.2</option>
                            </select>
                            </label>
                            <label class="viewer-field"><span>단락</span>
                            <select id="viewer-paragraph-spacing-select" data-role="viewer-action-change" data-action="paragraph-spacing" class="overlay-select" title="단락 간격 조절">
                                <option value="0.5">단락 0.5em</option>
                                <option value="1.0">단락 1.0em (기본)</option>
                                <option value="1.5">단락 1.5em</option>
                                <option value="2.0">단락 2.0em</option>
                                <option value="2.5">단락 2.5em</option>
                            </select>
                            </label>
                            <button data-role="viewer-action" data-action="font-size" data-value="-1" class="btn-overlay-fit" data-i18n-title="viewer.font_smaller" title="글자 작게">A-</button>
                            <button data-role="viewer-action" data-action="font-size" data-value="1" class="btn-overlay-fit" data-i18n-title="viewer.font_larger" title="글자 크게">A+</button>
                            <button data-role="viewer-action" data-action="toggle-theme-cycle" class="btn-overlay-fit" data-i18n-title="viewer.toggle_theme" title="배경 테마 순환 전환"><i class="fa-solid fa-circle-half-stroke"></i> <span id="viewer-theme-label">다크</span></button>
                        </div>
                    </div>
                </div>

                <!-- 탭 4: 여백 상세 조절 (통합 패널) -->
                <div class="overlay-tab-content" id="overlay-tab-margin">
                    <div class="overlay-margin-container">
                        <div class="quick-padding-row">
                            <label><span data-i18n="settings.padding_top_label">상단 여백</span> <span><span id="quick-novel-top-val">40</span>px</span></label>
                            <input type="range" id="quick-novel-top-slider" min="0" max="200" step="5" value="40" class="overlay-slider">
                        </div>
                        <div class="quick-padding-row">
                            <label><span data-i18n="settings.padding_bottom_label">하단 여백</span> <span><span id="quick-novel-bottom-val">60</span>px</span></label>
                            <input type="range" id="quick-novel-bottom-slider" min="0" max="200" step="5" value="60" class="overlay-slider">
                        </div>
                        <div class="quick-padding-row">
                            <label><span data-i18n="settings.padding_left_label">좌측 여백</span> <span><span id="quick-novel-left-val">20</span>px</span></label>
                            <input type="range" id="quick-novel-left-slider" min="0" max="200" step="5" value="20" class="overlay-slider">
                        </div>
                        <div class="quick-padding-row">
                            <label><span data-i18n="settings.padding_right_label">우측 여백</span> <span><span id="quick-novel-right-val">20</span>px</span></label>
                            <input type="range" id="quick-novel-right-slider" min="0" max="200" step="5" value="20" class="overlay-slider">
                        </div>
                    </div>
                </div>
            </div>
        </div>

            <div class="overlay-footer ridi-viewer-toolbar ridi-viewer-toolbar-bottom">
                <!-- 시크바 네비게이션 행 -->
                <div class="seekbar-nav-row">
                    <button class="seekbar-btn" id="seekbar-btn-first" data-role="viewer-action" data-action="jump-first" data-i18n-title="viewer.from_beginning" title="처음으로">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                    <div class="seekbar-track-wrap">
                        <span class="seekbar-page-num" id="seekbar-start-label">1 / 1</span>
                        <div class="seekbar-slider-container">
                            <div class="seekbar-tooltip" id="seekbar-tooltip">1</div>
                            <input
                                type="range"
                                id="viewer-page-slider"
                                min="1"
                                max="1"
                                value="1"
                                class="seekbar-input"
                            >
                        </div>
                    </div>
                    <button class="seekbar-btn" id="seekbar-btn-last" data-role="viewer-action" data-action="return-last-position" title="이전 읽던 위치로 돌아가기">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                </div>
                <span id="comic-overlay-page-info" class="viewer-page-info-source" aria-hidden="true">1 / 1</span>
            </div>

        <!-- 이미지(만화) 뷰어 -->
        <div id="comic-viewer-container" class="viewer-pane" style="display:none; position: relative;">
            <div class="comic-image-wrapper">
                <img id="comic-page-img" src="" alt="Comic Page">
            </div>
        </div>

        <!-- 공통 로딩/에러 오버레이 -->
        <div id="viewer-common-overlay" class="comic-loading-overlay" style="display:none; z-index: 10003;">
            <div class="comic-loading-content">
                <div id="viewer-common-spinner" class="comic-loading-spinner"></div>
                <p id="viewer-common-text" class="comic-loading-text" data-i18n="viewer.loading_title_default">파일을 불러오는 중...</p>
                <p id="viewer-common-sub" class="comic-loading-sub" data-i18n="viewer.loading_sub_default">파일을 준비하고 있습니다.<br>잠시만 기다려 주세요.</p>
                <button id="viewer-common-close-btn" class="btn-overlay-fit" style="display: none; margin-top: 1rem; border: 1px solid rgba(255,255,255,0.2); padding: 0.5rem 1rem; background: rgba(255,255,255,0.1); color: #f1f5f9; cursor: pointer; border-radius: 4px;" data-role="viewer-action" data-action="close" data-i18n="common.close">닫기</button>
            </div>
        </div>

        <!-- 다음 편 이어서 보기 확인 모달 -->
        <div id="viewer-next-episode-modal" class="comic-loading-overlay" style="display:none; z-index: 10007;">
            <div class="comic-loading-content">
                <p class="comic-loading-text" data-i18n="viewer.episode_finished">현재 편을 다 읽었습니다.</p>
                <p id="viewer-next-episode-title" class="comic-loading-sub" style="color: var(--app-accent); font-weight: bold; font-size: 1.05rem;"><span data-i18n="viewer.next_episode">다음 편: </span><span id="viewer-next-episode-dynamic">...</span></p>
                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <button id="viewer-next-episode-confirm-btn" class="btn-overlay-fit" style="border: 1px solid var(--app-accent); padding: 0.5rem 1.2rem; background: var(--app-accent); color: var(--app-accent-contrast); cursor: pointer; border-radius: 4px; font-weight: bold;" data-i18n="viewer.continue_reading">이어서 보기</button>
                    <button id="viewer-next-episode-cancel-btn" class="btn-overlay-fit" style="border: 1px solid rgba(255,255,255,0.2); padding: 0.5rem 1.2rem; background: rgba(255,255,255,0.1); color: #f1f5f9; cursor: pointer; border-radius: 4px;" data-i18n="common.close">닫기</button>
                </div>
            </div>
        </div>

        <!-- TXT 텍스트 리더 -->
        <div id="txt-viewer-container" class="viewer-pane txt-reader-theme-dark" style="display:none; position: relative;">
            <div id="txt-scroll-wrapper" style="width: 100%; height: 100%; box-sizing: border-box;">
                <div id="txt-content-area" class="txt-content"></div>
            </div>
        </div>

        <!-- PDF 뷰어 (pdf.js) -->
        <div id="pdf-viewer-container" class="viewer-pane" style="display:none; position: relative;">
            <div id="pdf-render-area" class="pdf-area" style="overflow: hidden; height: 100%; width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; box-sizing: border-box; padding: 10px;">
                <!-- 동적 캔버스 삽입 -->
            </div>
            <div class="pdf-nav-bar" style="z-index: 10005; display: none;">
                <button data-role="viewer-action" data-action="prev-page" class="btn-nav" data-i18n="common.prev">이전</button>
                <span id="pdf-page-info">1 / 1</span>
                <button data-role="viewer-action" data-action="next-page" class="btn-nav" data-i18n="common.next">다음</button>
            </div>
        </div>
    </div>
</div>
