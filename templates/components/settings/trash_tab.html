<!-- 삭제 관리 (휴지통) -->
<link rel="stylesheet" href="{{ static_asset_url('css/settings_trash.css') }}">
<div id="settings-tab-trash" class="settings-tab-content" style="display: none;">
    <button type="button" id="trash-library-filter" data-role="trash-clear-filter" hidden class="trash-button"></button>
    <div class="trash-header-container">
        <div class="trash-db-picker">
            <label for="trash-db-type">DB 선택:</label>
            <select id="trash-db-type" data-role="trash-db-type">
                <option value="general">일반 도서 DB</option>
                <option value="adult">성인 도서 DB</option>
                <option value="audiobook">오디오북 DB</option>
                <option value="video">영상강좌 DB</option>
            </select>
        </div>
        <div class="trash-header-buttons">
            <button type="button" class="trash-button" data-role="trash-restore-selected">
                <i class="fa-solid fa-rotate-left" aria-hidden="true"></i> 선택 복구
            </button>
            <button type="button" class="trash-button trash-button-danger-outline" data-role="trash-delete-selected">
                <i class="fa-solid fa-trash" aria-hidden="true"></i> 선택 삭제
            </button>
            <button type="button" class="trash-button trash-button-danger" data-role="trash-empty-all">
                <i class="fa-solid fa-dumpster-fire" aria-hidden="true"></i> 휴지통 비우기
            </button>
        </div>
    </div>
    <div class="settings-table-wrapper trash-table-scroll" tabindex="0" role="region" aria-label="삭제된 도서 목록">
        <table class="settings-table trash-table">
            <colgroup>
                <col class="trash-col-select"><col class="trash-col-title"><col class="trash-col-path">
                <col class="trash-col-library"><col class="trash-col-date"><col class="trash-col-actions">
            </colgroup>
            <thead>
                <tr>
                    <th scope="col" class="trash-select-cell"><input type="checkbox" id="trash-select-all" data-role="trash-select-all" aria-label="전체 선택"></th>
                    <th scope="col">도서명</th>
                    <th scope="col">원래 경로</th>
                    <th scope="col">카테고리</th>
                    <th scope="col">감지 시각</th>
                    <th scope="col" class="trash-actions-cell">제어</th>
                </tr>
            </thead>
            <tbody id="trash-list-body"></tbody>
        </table>
        <div id="trash-empty-state" style="display: none;">
            <i class="fa-solid fa-trash-arrow-up" aria-hidden="true"></i>
            <p>휴지통이 비어있습니다.</p>
            <p class="trash-empty-hint">스캔 도중 물리적으로 유실된 도서가 여기에 표시됩니다.</p>
        </div>
    </div>
</div>
<script src="{{ static_asset_url('js/settings_trash.js') }}"></script>
