    <style>
        :root {
            --color-accent: #a855f7;
            --color-accent-hover: #a855f7cc;
            --bg-glow-1: #a855f733;
            --bg-glow-2: #3b82f633;
            --bookoasis-engine-mark-a17f3c9: rgba(168, 85, 247, 0.12);
            --boe-copyright-whisper-a17f3c9: rgba(148, 163, 184, 0.72);
        }

        /* html 요소에도 overflow: hidden 필수 */
        html {
            overflow: hidden;
        }

        /* 최초 경로와 번역이 확정되기 전에는 서버 템플릿의 기본 그리드가 잠깐
           보이지 않게 한다. 초기화가 끝나면 JS가 이 클래스만 제거한다. */
        html.app-booting .sidebar-menu-wrapper,
        html.app-booting .library-main-content {
            visibility: hidden;
        }

        body {
            background-image: radial-gradient(circle at 15% 50%, var(--bg-glow-1), transparent 25%),
                radial-gradient(circle at 85% 30%, var(--bg-glow-2), transparent 25%);
            background-attachment: fixed;
            background-color: var(--app-bg-main, #0f172a);
            color: var(--app-text-primary);
            margin: 0;
            height: 100vh;          /* flex 자식의 높이 기준점 필수 */
            /* Mobile vh includes the space behind browser toolbars. The
               clipped app shell must follow the currently visible viewport. */
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            display: flex;
            flex-direction: column;
        }
    </style>

<script>
    // 페이지 로드 시 다국어 초기화 및 렌더링 실행
    // 모듈 자체가 네트워크 오류로 로드되지 않는 예외 상황에서도 화면이 영구히
    // 숨겨지지 않도록 최종 안전장치를 둔다.
    window.setTimeout(() => {
        document.documentElement.classList.remove('app-booting');
    }, 8000);

    document.addEventListener('DOMContentLoaded', async () => {
        await i18n.init();
        i18n.translateDOM();
        i18n.renderLanguageSelector('#settings-i18n-container');
        window.i18nReady = true;
        document.dispatchEvent(new Event('i18nReady'));
    });
</script>
